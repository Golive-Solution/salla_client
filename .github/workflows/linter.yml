name: Lint Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Run Python Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # or 3.11 if you're on Frappe v15

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 linter
        run: |
          echo "Running flake8..."
          flake8 salla_client --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 salla_client --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics